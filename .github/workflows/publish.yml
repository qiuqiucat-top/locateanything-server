name: publish-image

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build & push (${{ github.event_name }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tags=locateanything-server:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "tags=ghcr.io/${{ env.IMAGE_NAME }}:${VERSION},ghcr.io/${{ env.IMAGE_NAME }}:cuda,ghcr.io/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/${{ env.IMAGE_NAME }}:cuda,ghcr.io/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (push event)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=locateanything-server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build only (pull_request event)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### 🐳 Image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for tag in $(echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n'); do
            echo "- \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"
          done

  smoke-test:
    name: smoke-test
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Pull just-built image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cuda

      - name: Verify fork binary is shipped
        run: |
          CID=$(docker create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cuda)
          docker cp $CID:/app/llama-server /tmp/llama-server
          docker rm $CID
          chmod +x /tmp/llama-server
          if ! strings /tmp/llama-server | grep -q 'locateanything'; then
            echo "::error::llama-server binary does not contain the 'locateanything' projector symbol"
            exit 1
          fi
          echo "OK: fork binary confirmed"